# * 🌌 L€yzS Ricing - Advanced Lockscreen (adapted) 🌌
# 🔐  macOS-style single-line clock, profile image, pywal-dynamic colors.

# --- 🎨 COLOR DYNAMICS (PYWAL) ---
source = $HOME/.cache/wal/colors-hyprland.conf
# Text emphasis tiers (fg_primary / fg_secondary / fg_muted / fg_accent),
# generated by ~/.config/wal/templates/hyprlock-tiers.conf
source = $HOME/.cache/wal/hyprlock-tiers.conf

# --- 🖼️ BACKGROUND — sharp current wallpaper (kept fresh by wal-refresh.sh) ---
# blur_passes = 0: macOS does not blur its lock wallpaper. Brightness still
# dims it a little, because without blur the text has to stay legible over
# whatever the wallpaper happens to be — that is the dial to turn if the
# clock gets hard to read (lower = darker backdrop).
background {
    monitor =
    path = $HOME/.cache/current_wallpaper.png
    blur_passes = 0
    contrast = 1.0
    brightness = 0.65
    vignette = 0.35
    vignette_opacity = 0.25
    crossfade_time = 0.5
}

# --- 📅 DATE (above the time, macOS order) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %-d %B")"
    color = $fg_secondary
    font_size = 17
    font_family = Noto Sans
    position = 0, 325
    halign = center
    valign = center
}

# --- 🕒 CLOCK — one line, 12-hour, no leading zero ---
# Uses the shell's `date`, not hyprlock's own formatter, so %-I (no zero pad)
# is fine here — unlike waybar, whose chrono library rejects the "-" flag.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = $fg_primary
    font_size = 100
    font_family = Noto Sans
    position = 0, 240
    halign = center
    valign = center
}

# --- 👤 PROFILE IMAGE ---
# picture.png is a 512x512 square crop of ~/Documents/IMG_0880.png. The SDDM
# login avatar is installed from this same file, so replacing it here updates
# both screens. (Square matters: rounding = -1 renders it as a circle, and a
# portrait-ratio source would distort.) Previous photo: picture.jpg.bak-preIMG0880
image {
    monitor =
    path = $HOME/.config/Hyprlock-Pfp/picture.png
    size = 130
    rounding = -1
    border_size = 4
    border_color = $fg_accent
    position = 0, 368
    halign = center
    valign = bottom
}

# --- ⌨️ INPUT FIELD ---
input-field {
    monitor =
    size = 210, 40
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    outer_color = $fg_accent
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = $fg_primary
    fade_on_empty = false
    placeholder_text = <span foreground="##c2c5c799">Password...</span>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

# --- 🔑 AUTH ---
# hyprlock >= 0.6 moved fingerprint out of general{} into auth:fingerprint:*.
# The old general:enable_fingerprint keys were silently ignored by 0.9.6, so
# the lockscreen was falling back to pam_fprintd (which blocks the password
# box until the sensor times out). Native fingerprint here runs over fprintd
# D-Bus *in parallel* with typing, so either one gets you in.
auth {
    fingerprint {
        enabled = true
        ready_message = Place your finger on the sensor...
        present_message = Scanning finger...
    }
}
