general {
    lock_cmd = pidof hyprlock || hyprlock       # Kilitleme komutu
    before_sleep_cmd = loginctl lock-session    # Uyku moduna girmeden önce kilitle
    after_sleep_cmd = hyprctl dispatch dpms on  # Uyanınca ekranı aç
}

listener {
    timeout = 600                                # 600 saniye = 10 dakika
    on-timeout = loginctl lock-session           # Süre dolunca ekranı kilitle
}

listener {
    timeout = 630                                # 10.5 dakika (Kilitlendikten biraz sonra)
    on-timeout = hyprctl dispatch dpms off       # Ekranı tamamen kapat (güç tasarrufu)
    on-resume = hyprctl dispatch dpms on        # Hareket edince ekranı geri aç
}

# --- 💓 HEARTBEAT IDLE MARKER ---
# The ALIAS heartbeat needs to know when this machine is idle. xprintidle is
# X11-only — under XWayland its counter never resets on Wayland input, so it
# would report "away" while actively working. hypridle already knows the real
# idle state, so it just leaves a marker the heartbeat can stat().
#
# Keep this timeout equal to IDLE_MARKER_AFTER_MS in
# ~/ALIAS/services/heartbeat/heartbeat.js (currently 5 min), and below the
# 10-min lock listener so "away" registers before the screen locks.
listener {
    timeout = 300
    on-timeout = touch $XDG_RUNTIME_DIR/heartbeat-idle-since
    on-resume = rm -f $XDG_RUNTIME_DIR/heartbeat-idle-since
}
