# hyprlauncher — feature setup
# Finders: type normally for apps, "=" math, "." unicode/emoji, "'" fonts

general {
    grab_focus = true
}

cache {
    # remember frequently launched apps (stored in ~/.local/share/hyprlauncher)
    enabled = true
}

finders {
    default_finder = desktop
    desktop_icons = true
    math_prefix = =
    unicode_prefix = .
    font_prefix = '
}

ui {
    window_size = 620 380
}
