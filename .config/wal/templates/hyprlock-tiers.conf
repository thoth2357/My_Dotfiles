# Text emphasis tiers — generated by pywal from the wallpaper.
# Do not edit; edit ~/.config/wal/templates/hyprlock-tiers.conf
#
# Highest of the three surfaces on purpose: hyprlock draws straight onto
# blurred wallpaper with no panel behind it, so it has the least contrast
# headroom anywhere on the system. Measured contrast on the bar showed the
# original 92/65/45 was well under the WCAG floor once a translucent
# backdrop was in play.
$fg_primary   = rgba({foreground.rgb},1.0)
$fg_secondary = rgba({foreground.rgb},0.86)
$fg_muted     = rgba({foreground.rgb},0.70)
$fg_accent    = rgba({color4.rgb},1.0)
