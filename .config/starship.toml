# GitHub account currently authenticated with `gh`.
#
# Read from ~/.config/gh/hosts.yml rather than `gh api user`: this runs on
# EVERY prompt, and an API call would add network latency to each one. The
# username is stored in plaintext there; the token lives in the keyring, so
# nothing sensitive is touched.
#
# Single awk process, no pipeline, and `when` skips it entirely when gh
# isn't configured.
[custom.github_user]
description = "GitHub account gh is logged in as"
# Read from hosts.yml, not `gh api user`: this runs on EVERY prompt and an API
# call would put network latency in front of each one. The username is stored
# in plaintext there; the token lives in the keyring, so nothing secret is read.
# (TOML note: ''' literal, because the awk script contains single quotes and
# TOML single-quoted strings have no escape sequences.)
command = '''awk '/^[[:space:]]+user:/{print $2; exit}' "$HOME/.config/gh/hosts.yml"'''
when = 'test -f "$HOME/.config/gh/hosts.yml"'
# Two non-obvious requirements here:
#  1. Pin /bin/sh. Starship otherwise uses $STARSHIP_SHELL, which is fish, and
#     fish takes ~1.9s to start on this machine — every custom module silently
#     blew the 500ms command_timeout and rendered nothing.
#  2. NO "-c". Starship feeds the command to the shell on STDIN, so "sh -c"
#     receives no argument, exits immediately and produces empty output.
shell = ["/bin/sh"]
format = "[ $output]($style) "
style = "bold purple"
