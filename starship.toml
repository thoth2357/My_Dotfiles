[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = '🌱 '
truncation_length = 6
truncation_symbol = '.'
ignore_branches = ['master', 'main']

# ~/.config/starship.toml

[git_status]
conflicted = "⚔️ "
ahead = "🏎️💨 ×${count}"
behind = "🐢×${count}"
diverged = "🔱 🏎️ 💨 ×${ahead_count} 🐢 ×${behind_count}"
untracked = "🛤️×${count}"
modified = "📝×${count}"
staged = "🗃️×${count}"
renamed = "📛×${count}"
deleted = "🗑️${count}"
stashed = "📦x${count}"

