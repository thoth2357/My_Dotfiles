[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
style = 'bold blue'
symbol = '🅰 '
[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'ue1'
[aws.profile_aliases]
CompanyGroupFrobozzOnCallAccess = 'Frobozz'

[buf]
symbol = " "

[c]
symbol = " "

